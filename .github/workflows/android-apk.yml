name: Android APK

# Produces the installable Android package for YOUSIVAR–Ω.
#
#   • every run builds and validates a DEBUG APK and uploads it as a workflow
#     artifact (download it from the run's summary page);
#   • a `v*` tag (or a manual run with `build_release` enabled) also builds a
#     SIGNED release APK, and publishes it as a GitHub Release asset — the
#     stable URL the owner pastes into the console's Android release page.
#
# Signing material only ever comes from protected repository secrets; nothing is
# echoed, and a release build fails loudly instead of shipping unsigned.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Origin the Android shell loads (defaults to the YOUSIVAR_APP_URL repository secret)'
        required: false
        type: string
      build_release:
        description: 'Also build a signed release APK (requires the signing secrets)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'artifacts/yousivar-omega/**'
      - '.github/workflows/android-apk.yml'
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  YOUSIVAR_APP_URL: ${{ inputs.app_url || secrets.YOUSIVAR_APP_URL }}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # This action installs `tools platform-tools` by default, but the
          # legacy `tools` package no longer exists in the SDK repository, so the
          # default fails the job with "Failed to find package 'tools'". Only
          # platform-tools is needed here; the platform and build-tools the
          # project targets are installed explicitly in the next step.
          packages: 'platform-tools'

      - name: Install the SDK components the project targets
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # The Android shell loads the deployed web application, so the pipeline
      # builds it first: a release is never produced next to a site that does
      # not compile.
      - name: Build the web application
        env:
          PORT: '3000'
          BASE_PATH: /
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/yousivar-omega run build

      - name: Install the Android wrapper dependencies
        working-directory: android
        run: npm ci

      - name: Keep the tag and the packaged version in step
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          packaged=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $packaged in android/android/app/build.gradle"
            exit 1
          fi

      # A release is distributed: a shell packaged without an origin would
      # install and then only report "no application URL configured", which is
      # exactly the placeholder APK_RELEASE.md forbids offering. A debug build is
      # allowed without one — that is how the shell itself gets checked — but the
      # run says so loudly instead of passing silently.
      - name: Check that the shell has an application URL
        env:
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.build_release }}
        run: |
          if [ -n "$YOUSIVAR_APP_URL" ]; then
            echo "The packaged shell will load $YOUSIVAR_APP_URL"
            exit 0
          fi
          if [ "$RELEASE_BUILD" = "true" ]; then
            echo "::error::No application URL is configured, so this release would ship a shell that cannot load the site. Set the YOUSIVAR_APP_URL repository secret (or pass the app_url input) and run again — see APK_RELEASE.md."
            exit 1
          fi
          echo "::warning::No YOUSIVAR_APP_URL is configured: this debug APK will show the bundled 'no application URL configured' screen. Set the YOUSIVAR_APP_URL repository secret to point it at the deployed site."

      - name: Build, validate and checksum the debug APK
        working-directory: android
        run: npm run build:debug

      - name: Upload the debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yousivar-omega-apk-debug
          path: |
            android/dist/debug/*.apk
            android/dist/debug/*.sha256
            android/dist/debug/build.json
          if-no-files-found: error
          retention-days: 30

      # The signing secrets are injected into this step only, never into the whole
      # workflow, so no unrelated step can read them.
      - name: Prepare the signing keystore
        id: signing
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured, so no signed release can be produced. See APK_RELEASE.md."
            exit 1
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured, so no signed release can be produced. See APK_RELEASE.md."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "keystore=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          echo "Signing material prepared."

      - name: Build, validate and checksum the signed release APK
        if: steps.signing.outcome == 'success'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:release

      - name: Upload the release APK
        if: steps.signing.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yousivar-omega-apk-release
          path: |
            android/dist/release/*.apk
            android/dist/release/*.sha256
            android/dist/release/build.json
          if-no-files-found: error
          retention-days: 90

      - name: Report what was produced
        if: always()
        working-directory: android
        run: |
          for mode in debug release; do
            if [ -f "dist/$mode/build.json" ]; then
              echo "### $mode APK" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "dist/$mode/build.json" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  publish:
    name: Publish the release asset
    needs: apk
    # Only a tag publishes: a branch build must never create a public release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the signed release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: yousivar-omega-apk-release
          path: release

      - name: Attach the APK, its checksum and its build record to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          NOTES: ${{ github.ref_name }}
        with:
          files: |
            release/*.apk
            release/*.sha256
            release/build.json
          body: |
            ## YOUSIVAR–Ω Android release ${{ env.NOTES }}

            Download the `.apk` asset below, then paste its URL, size and SHA-256
            checksum into the owner console → **Android release** to offer it on the
            website (see APK_RELEASE.md).

            The `.sha256` file contains the checksum of the attached APK.
          fail_on_unmatched_files: true
