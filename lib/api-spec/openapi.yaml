      properties:
        settings:
          $ref: "#/components/schemas/SiteSettings"
        profile:
          $ref: "#/components/schemas/DeveloperProfile"
    AdminIdentity:
      type: object
      required: [userId, email, role, permissions]
      properties:
        userId:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [OWNER, SUPER_ADMIN, ADMIN, PARTNER, CUSTOM_ROLE]
        permissions:
          type: array
          items:
            type: string
    AdminSummary:
      type: object
