openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: YOUSIVAR–Ω public content, owner administration, and integration API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Publicly visible site content.
  - name: admin
    description: Authenticated owner and administrator operations.
  - name: assistant
    description: Server-side AI assistant.
  - name: storage
    description: Secure media upload and object delivery.
  - name: owner
    description: >
      Owner-only console operations: the Termux catalog, the GitHub project
      integration and the startup-audio settings. Every endpoint here requires
      the OWNER role and is enforced on the server.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /site:
    get:
      operationId: getPublicSite
      tags: [public]
      summary: Get public site configuration and developer profile
      responses:
        "200":
          description: Publicly safe site configuration and profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSite"
  /content:
    get:
      operationId: listPublicContent
      tags: [public]
      summary: List published content
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Published items only.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentItem"
  /admin/me:
    get:
      operationId: getAdminIdentity
      tags: [admin]
      summary: Get authenticated application identity and permissions
      responses:
        "200":
          description: Current identity and application role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get content and activity summary
      responses:
        "200":
          description: Summary derived from persisted application records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/activity:
    get:
      operationId: listAdminActivity
      tags: [admin]
      summary: List recent administrative audit events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Recent security-relevant administrative events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/content:
    get:
      operationId: listAdminContent
      tags: [admin]
      summary: List all content for administration
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, published, archived]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Filtered administrative content.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createContentItem
      tags: [admin]
      summary: Create a content item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemInput"
      responses:
        "201":
          description: Created content item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/content/{id}:
    patch:
      operationId: updateContentItem
      tags: [admin]
      summary: Update a content item
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemUpdate"
      responses:
        "200":
          description: Updated content item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteContentItem
      tags: [admin]
      summary: Delete a content item
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Content item deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/content/{id}/publish:
    patch:
      operationId: setContentItemPublished
      tags: [admin]
      summary: Publish or unpublish a content item
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishContentInput"
      responses:
        "200":
          description: Updated publication status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Read editable site settings
      responses:
        "200":
          description: Persisted branding and localization settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update editable site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Persisted settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/profile:
    get:
      operationId: getAdminProfile
      tags: [admin]
      summary: Read developer profile
      responses:
        "200":
          description: Persisted developer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateAdminProfile
      tags: [admin]
      summary: Update developer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeveloperProfileInput"
      responses:
        "200":
          description: Persisted developer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/providers:
    get:
      operationId: listAiProviders
      tags: [admin]
      summary: List provider configuration without exposing credentials
      responses:
        "200":
          description: Provider status and non-secret model settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/providers/{provider}:
    put:
      operationId: updateAiProvider
      tags: [admin]
      summary: Update non-secret AI provider settings
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, gemini, groq, ollama]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderUpdate"
      responses:
        "200":
          description: Saved provider settings and current configured status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/assistant:
    get:
      operationId: getAssistantSettings
      tags: [admin]
      summary: Read assistant settings
      responses:
        "200":
          description: Persisted assistant instructions and public appearance settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateAssistantSettings
      tags: [admin]
      summary: Update assistant settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantSettingsUpdate"
      responses:
        "200":
          description: Persisted assistant settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/assistant/message:
    post:
      operationId: sendAssistantMessage
      tags: [assistant]
      summary: Send a message to the configured server-side AI provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageInput"
      responses:
        "200":
          description: Assistant reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Selected provider is not configured or unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/github/import:
    post:
      operationId: importGithubRepository
      tags: [admin]
      summary: Import public GitHub repository metadata as a draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubImportInput"
      responses:
        "201":
          description: Repository metadata imported as a draft item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: GitHub rate limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List users and application roles
      responses:
        "200":
          description: Application role assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/users/{userId}/role:
    put:
      operationId: updateAdminUserRole
      tags: [admin]
      summary: Assign an application role to a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserRoleUpdate"
      responses:
        "200":
          description: Saved role assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for a validated media upload
      description: The file is uploaded directly to object storage after this metadata request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/media/complete:
    post:
      operationId: completeMediaUpload
      tags: [storage]
      summary: Verify uploaded file bytes and register media metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaCompleteInput"
      responses:
        "201":
          description: Verified media record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/termux:
    get:
      operationId: getTermuxConsole
      tags: [owner]
      summary: Owner-only Termux management console
      description: >
        Returns the owner's Termux catalog (projects, commands, scripts and
        guides) together with an explicit statement of what this deployment can
        and cannot execute. The web API never runs shell commands.
      responses:
        "200":
          description: Termux catalog and execution capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermuxConsole"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateTermuxConsole
      tags: [owner]
      summary: Replace the owner's Termux catalog
      description: Stores the catalog entries. Nothing here is executed by the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermuxConsoleUpdate"
      responses:
        "200":
          description: Stored Termux catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermuxConsole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/termux/confirm:
    post:
      operationId: confirmTermuxCommand
      tags: [owner]
      summary: Record an explicit owner confirmation for a Termux entry
      description: >
        Writes an audit entry for the confirmed review of one catalog entry and
        answers with the exact command to run locally. It never executes it:
        no web endpoint of this application has shell access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermuxConfirmation"
      responses:
        "200":
          description: Confirmation recorded; execution is not offered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermuxConfirmationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/github/status:
    get:
      operationId: getGithubIntegration
      tags: [owner]
      summary: Owner-only GitHub integration status
      responses:
        "200":
          description: Connection state, tracked imports and capability flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubIntegration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/github/connect/start:
    post:
      operationId: startGithubConnect
      tags: [owner]
      summary: Begin the GitHub OAuth connection
      description: >
        Returns the GitHub authorize URL to open. Requires a registered GitHub
        OAuth app; when it is not configured the response says so instead of
        returning a broken link.
      responses:
        "200":
          description: Authorize URL to open in the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubConnectStart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/github/connect/token:
    post:
      operationId: connectGithubToken
      tags: [owner]
      summary: Connect GitHub with a scoped access token
      description: >
        Stores the supplied token encrypted, server-side only. The value is
        never returned to the browser, never logged and can be revoked with
        DELETE /admin/github/connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubTokenConnect"
      responses:
        "200":
          description: Connection established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubIntegration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/github/callback:
    get:
      operationId: completeGithubConnect
      tags: [owner]
      summary: GitHub OAuth callback
      description: >
        Exchanges the authorization code for a token (kept server-side) and
        redirects the browser back to the owner console. Every failure is
        reported as a redirect with a status query parameter, never as a
        partial connection.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect back to the owner console.
  /admin/github/repositories:
    get:
      operationId: listGithubRepositories
      tags: [owner]
      summary: List repositories the connected account can read
      responses:
        "200":
          description: Repositories visible to the connection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GithubRepositorySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: GitHub could not answer the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/github/repositories/{owner}/{name}/branches:
    get:
      operationId: listGithubBranches
      tags: [owner]
      summary: List the branches of one repository
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubBranchList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: GitHub could not answer the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/github/preview:
    post:
      operationId: previewGithubImport
      tags: [owner]
      summary: Preview what an import would publish
      description: >
        Reads repository metadata, the README and the top-level file list of the
        selected branch. Sensitive paths are never read and are reported as
        skipped; nothing is written to the catalog by this call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubImportRequest"
      responses:
        "200":
          description: Preview of the import, nothing published yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: GitHub could not answer the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/github/publish:
    post:
      operationId: publishGithubImport
      tags: [owner]
      summary: Publish or update a reviewed repository in the catalog
      description: >
        Creates or updates the catalog entry for a repository. It saves a draft
        unless the owner explicitly asks for publication, and it records the
        import status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubPublishRequest"
      responses:
        "201":
          description: Catalog entry created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubPublishResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: GitHub could not answer the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/github/connection:
    delete:
      operationId: disconnectGithub
      tags: [owner]
      summary: Disconnect GitHub and delete the stored access token
      description: >
        Deletes the stored token. When the token was granted through OAuth the
        API also asks GitHub to revoke the grant; the outcome is reported.
      responses:
        "200":
          description: Disconnected; revocation outcome included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubIntegration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The authenticated user lacks the required application permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Requested record was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthStatus:
      description: >
        Liveness and deployment facts. `runtime` and `storageDriver` come from
        the environment the process booted with, so a deployment can be checked
        without reading any secret.
      type: object
      properties:
        status:
          type: string
        runtime:
          type: string
          enum: [node, cloudflare-worker]
        storageDriver:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ContentAction:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        labelAr:
          type: ["string", "null"]
        url:
          type: string
          maxLength: 2048
        kind:
          type: string
          enum: [primary, secondary]
          default: secondary
    MediaReference:
      type: object
      required: [url, kind]
      properties:
        url:
          type: string
          maxLength: 2048
        kind:
          type: string
          enum: [image, gif, video, audio, icon]
        alt:
          type: ["string", "null"]
    ContentItem:
      type: object
      required: [id, category, title, description, tags, actions, media, status, featured, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
        titleAr:
          type: ["string", "null"]
        description:
          type: string
        descriptionAr:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ContentAction"
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaReference"
        status:
          type: string
          enum: [draft, published, archived]
        featured:
          type: boolean
        sortOrder:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContentItemInput:
      type: object
      required: [category, title, description]
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 200
        titleAr:
          type: ["string", "null"]
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        descriptionAr:
          type: ["string", "null"]
          maxLength: 10000
        url:
          type: ["string", "null"]
          maxLength: 2048
        tags:
          type: array
          items:
            type: string
            maxLength: 60
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ContentAction"
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaReference"
        status:
          type: string
          enum: [draft, published, archived]
          default: draft
        featured:
          type: boolean
          default: false
        sortOrder:
          type: integer
          default: 0
        metadata:
          type: object
          additionalProperties: true
    ContentItemUpdate:
      type: object
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 200
        titleAr:
          type: ["string", "null"]
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        descriptionAr:
          type: ["string", "null"]
          maxLength: 10000
        url:
          type: ["string", "null"]
          maxLength: 2048
        tags:
          type: array
          items:
            type: string
            maxLength: 60
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ContentAction"
        media:
          type: array
          items:
            $ref: "#/components/schemas/MediaReference"
        status:
          type: string
          enum: [draft, published, archived]
        featured:
          type: boolean
        sortOrder:
          type: integer
        metadata:
          type: object
          additionalProperties: true
    PublishContentInput:
      type: object
      required: [published]
      properties:
        published:
          type: boolean
    ThemeColors:
      type: object
      description: Editable palette. Every value is a six digit hex colour, applied to the public site and the console.
      required: [background, surface, surfaceAlt, border, text, highlight, mutedText, mutedSoft, mutedFaint, accent, primary, primaryHover, secondary, focusRing, glass, gradientFrom, gradientTo]
      properties:
        background: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        surface: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        surfaceAlt: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        border: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        text: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        highlight: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        mutedText: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        mutedSoft: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        mutedFaint: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        accent: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        primary: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        primaryHover: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        secondary: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        focusRing: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        glass: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        gradientFrom: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        gradientTo: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
    ThemeTypography:
      type: object
      description: Editable type system. Font families are Google Fonts family names injected at runtime; the Arabic families apply whenever the site renders RTL.
      required: [fontSans, fontSerif, fontMono, fontSansAr, fontSerifAr, fontMonoAr, baseFontSize, bodyLineHeight, bodyLetterSpacing, bodyWeight, headingWeight]
      properties:
        fontSans: { type: string, maxLength: 80 }
        fontSerif: { type: string, maxLength: 80 }
        fontMono: { type: string, maxLength: 80 }
        fontSansAr: { type: string, maxLength: 80 }
        fontSerifAr: { type: string, maxLength: 80 }
        fontMonoAr: { type: string, maxLength: 80 }
        baseFontSize: { type: number, minimum: 14, maximum: 19 }
        bodyLineHeight: { type: number, minimum: 1.2, maximum: 2.2 }
        bodyLetterSpacing: { type: number, minimum: -0.05, maximum: 0.2 }
        bodyWeight: { type: integer, minimum: 300, maximum: 700 }
        headingWeight: { type: integer, minimum: 300, maximum: 800 }
    ThemeIdentity:
      type: object
      description: Editable identity marks and wording. An empty logo URL keeps the typographic mark.
      required: [logoMark, logoUrl, faviconUrl, navWork, navWorkAr, navAbout, navAboutAr, privateConsole, privateConsoleAr, ctaWork, ctaWorkAr, sectionWorkTitle, sectionWorkTitleAr]
      properties:
        logoMark: { type: string, maxLength: 8 }
        logoUrl: { type: string, maxLength: 2048 }
        faviconUrl: { type: string, maxLength: 2048 }
        navWork: { type: string, maxLength: 60 }
        navWorkAr: { type: string, maxLength: 60 }
        navAbout: { type: string, maxLength: 60 }
        navAboutAr: { type: string, maxLength: 60 }
        privateConsole: { type: string, maxLength: 60 }
        privateConsoleAr: { type: string, maxLength: 60 }
        ctaWork: { type: string, maxLength: 60 }
        ctaWorkAr: { type: string, maxLength: 60 }
        sectionWorkTitle: { type: string, maxLength: 80 }
        sectionWorkTitleAr: { type: string, maxLength: 80 }
    SiteTheme:
      type: object
      required: [colors, typography, identity]
      properties:
        colors: { $ref: "#/components/schemas/ThemeColors" }
        typography: { $ref: "#/components/schemas/ThemeTypography" }
        identity: { $ref: "#/components/schemas/ThemeIdentity" }
    SiteSettings:
      type: object
      required: [projectName, projectNameAr, tagline, taglineAr, defaultLocale, accentColor, reducedMotion, theme, android, audio]
      properties:
        projectName:
          type: string
        projectNameAr:
          type: string
        tagline:
          type: string
        taglineAr:
          type: string
        defaultLocale:
          type: string
          enum: [en, ar]
        accentColor:
          type: string
        reducedMotion:
          type: boolean
        theme:
          $ref: "#/components/schemas/SiteTheme"
        android:
          $ref: "#/components/schemas/AndroidRelease"
        audio:
          $ref: "#/components/schemas/StartupAudio"
    AndroidRelease:
      description: >
        The published Android release. `apkUrl` stays empty until a real APK
        artifact exists, and the public download block is rendered only when
        `downloadEnabled` is true and `apkUrl` points at an APK file — never at
        a placeholder, a source archive or an HTML page.
      type: object
      required: [versionName, versionCode, releasedAt, downloadEnabled, apkUrl, apkSizeBytes, checksumSha256, minAndroid, releaseNotes, releaseNotesAr, debugBuild]
      properties:
        versionName:
          type: string
        versionCode:
          type: integer
        releasedAt:
          type: ["string", "null"]
        downloadEnabled:
          type: boolean
        apkUrl:
          type: string
        apkSizeBytes:
          type: integer
        checksumSha256:
          type: string
        minAndroid:
          type: string
        releaseNotes:
          type: string
        releaseNotesAr:
          type: string
        debugBuild:
          type: boolean
    AndroidReleaseUpdate:
      type: object
      properties:
        versionName:
          type: string
          maxLength: 40
        versionCode:
          type: integer
          minimum: 1
          maximum: 2147483647
        releasedAt:
          type: ["string", "null"]
          maxLength: 40
        downloadEnabled:
          type: boolean
        apkUrl:
          type: string
          maxLength: 2048
        apkSizeBytes:
          type: integer
          minimum: 0
          maximum: 2147483647
        checksumSha256:
          type: string
          maxLength: 64
        minAndroid:
          type: string
          maxLength: 60
        releaseNotes:
          type: string
          maxLength: 4000
        releaseNotesAr:
          type: string
          maxLength: 4000
        debugBuild:
          type: boolean
    SiteSettingsUpdate:
      type: object
      required: [projectName, projectNameAr, tagline, taglineAr, defaultLocale, accentColor, reducedMotion, theme]
      properties:
        projectName:
          type: string
          minLength: 1
          maxLength: 100
        projectNameAr:
          type: string
          minLength: 1
          maxLength: 100
        tagline:
          type: string
          maxLength: 300
        taglineAr:
          type: string
          maxLength: 300
        defaultLocale:
          type: string
          enum: [en, ar]
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        reducedMotion:
          type: boolean
        theme:
          $ref: "#/components/schemas/SiteThemeUpdate"
        android:
          $ref: "#/components/schemas/AndroidReleaseUpdate"
        audio:
          $ref: "#/components/schemas/StartupAudioUpdate"
    SiteThemeUpdate:
      type: object
      required: [colors, typography, identity]
      properties:
        colors: { $ref: "#/components/schemas/ThemeColors" }
        typography: { $ref: "#/components/schemas/ThemeTypography" }
        identity: { $ref: "#/components/schemas/ThemeIdentity" }
    DeveloperProfile:
      type: object
