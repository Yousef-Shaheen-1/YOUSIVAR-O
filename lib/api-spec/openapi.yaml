    TermuxEntryKind:
      type: string
      enum: [project, command, script, guide]
    TermuxEntry:
      description: >
        One entry of the owner's Termux catalog. `command` is documentation the
        owner reviews and runs on their own device; the API never executes it.
      type: object
      required: [id, kind, title, titleAr, summary, command, documentationUrl, requiresRoot, requiresStorage, enabled, notes]
      properties:
        id:
          type: string
          maxLength: 60
        kind:
          $ref: "#/components/schemas/TermuxEntryKind"
        title:
          type: string
          maxLength: 160
        titleAr:
          type: ["string", "null"]
          maxLength: 160
        summary:
          type: string
          maxLength: 600
        command:
          type: string
          maxLength: 4000
        documentationUrl:
          type: ["string", "null"]
          maxLength: 2048
        requiresRoot:
          type: boolean
        requiresStorage:
          type: boolean
        enabled:
          type: boolean
        notes:
          type: ["string", "null"]
          maxLength: 1000
    TermuxCapability:
      description: >
        What this deployment can do with a catalog entry. `executionAvailable`
        is false for every web deployment of this application, and the reason is
        stated instead of hidden.
      type: object
      required: [executionAvailable, reason, localRunHint, supportedKinds]
      properties:
        executionAvailable:
          type: boolean
        reason:
