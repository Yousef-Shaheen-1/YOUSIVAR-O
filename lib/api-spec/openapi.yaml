        biographyAr:
          type: string
        portraitUrl:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        socials:
          type: array
          items:
            $ref: "#/components/schemas/SocialLink"
    DeveloperProfileInput:
      type: object
      required: [name, nameAr, biography, biographyAr, skills, socials]
      properties:
        name:
          type: string
          maxLength: 120
        nameAr:
          type: string
          maxLength: 120
        biography:
          type: string
          maxLength: 5000
        biographyAr:
          type: string
          maxLength: 5000
        portraitUrl:
          type: ["string", "null"]
          maxLength: 2048
        skills:
          type: array
          items:
            type: string
            maxLength: 80
        socials:
          type: array
          items:
            $ref: "#/components/schemas/SocialLink"
    SocialLink:
      type: object
      required: [label, url, visible]
      properties:
        label:
